<!DOCTYPE html>

<body>

    <h1>PHAN 1 - CONTENT BOX VS BORDER BOX</h1>

    <div class="box-container">

        <!-- Hop content-box -->

            <h2>Content Box</h2>
            <p>box-sizing: content-box</p>
        </div>

        <!-- Hop border-box -->
        <div class="box border-box">
            <h2>Border Box</h2>

        </div>

    </div>

    <hr>

    <h1>PHAN 2 - LAYOUT 3 COT</h1>

    <h2>Truong hop KHONG dung border-box</h2>

    <div class="layout normal-layout">

        <div class="sidebar">
            Sidebar
        </div>

        <div class="content">
            Content
        </div>

        <div class="ads">
            Ads
        </div>

    </div>

    <h2>Truong hop CO dung border-box</h2>

    <div class="layout fixed-layout">

        <div class="sidebar">
            Sidebar
        </div>

            Content
        </div>

        <div class="ads">
            Ads
        </div>

    </div>
