<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Đăng ký tài khoản</h2>
        <form id="regForm">
            <div class="form-group">
                <label>Tên (2-50 ký tự)</label>
                <input type="text" id="name" autocomplete="off">
                <span class="icon"></span>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email">
                <small class="error-msg">Email không hợp lệ</small>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password">
                <div class="strength-bar"><div id="strengthProgress"></div></div>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword">
                <span class="icon"></span>
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone" placeholder="0123-456-789">
            </div>
            <button type="submit" id="submitBtn" disabled>Đăng ký</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
