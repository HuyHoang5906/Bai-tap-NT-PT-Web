<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TechStore</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
            <select id="sortSelect">
                <option value="default">Sắp xếp</option>
                <option value="priceAsc">Giá tăng dần</option>
                <option value="priceDesc">Giá giảm dần</option>
                <option value="nameAsc">Tên A-Z</option>
                <option value="rating">Đánh giá cao nhất</option>
            </select>
            <button id="cartBtn">🛒 Giỏ hàng <span id="cartBadge">0</span></button>
            <button id="themeToggle">🌙</button>
        </div>
        <nav id="categoryNav">
            <button class="cat-btn active" data-cat="all">Tất cả</button>
            <button class="cat-btn" data-cat="phone">Điện thoại</button>
            <button class="cat-btn" data-cat="laptop">Laptop</button>
            <button class="cat-btn" data-cat="tablet">Tablet</button>
            <button class="cat-btn" data-cat="accessory">Phụ kiện</button>
        </nav>
    </header>

    <main id="catalog"></main> <div id="productModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
