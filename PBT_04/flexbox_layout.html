<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài B2 - Flexbox Layout</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <!-- Phần 1: Navbar -->
    <nav class="navbar">
        <div class="logo">LOGO</div>
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>
        <div class="auth">
            <button class="btn-login">Login</button>
            <button class="btn-register">Register</button>
        </div>
    </nav>

    <!-- Phần 2: Product Cards Grid -->
    <main class="container">
        <h2>Sản phẩm nổi bật</h2>
        <div class="product-grid">
            <!-- Tạo 8 card sản phẩm -->
            <!-- Card 1 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <div class="card-content">
                    <h3>Sản phẩm 1</h3>
                    <p class="price">200.000 VNĐ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <!-- Card 2 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">

                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

                <img src="https://via.placeholder.com/300x200" alt="Product">
                <div class="card-content">

                    <p class="price">150.000 VNĐ</p>
                </div>

                    <p class="price">300.000 VNĐ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <!-- Card 5 -->

                    <p class="price">120.000 VNĐ</p>

                    <p class="price">90.000 VNĐ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>
        </div>
    </main>

</body>
</html>
