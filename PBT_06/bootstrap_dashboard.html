<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block bg-dark text-white position-fixed h-100 p-3">
                <h4>Admin</h4>
                <ul class="list-group list-group-flush mt-4">
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary">Dashboard</a>
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary">Đơn hàng</a>
                </ul>
            </nav>

            <main class="col-md-10 offset-md-2 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="#">Home</a></li>
                            <li class="breadcrumb-item active">Dashboard</li>
                        </ol>
                    </nav>
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Admin User</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Hồ sơ</a></li>
                            <li><a class="dropdown-item" href="#">Đăng xuất</a></li>
                        </ul>
                    </div>
                </div>

                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    Đăng nhập thành công! Chào mừng bạn quay trở lại.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="card text-white bg-primary"><div class="card-body"><h5>Doanh thu</h5><h3>$5,000</h3></div></div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-success"><div class="card-body"><h5>Đơn mới</h5><h3>120</h3></div></div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-warning"><div class="card-body"><h5>Chờ xử lý</h5><h3>15</h3></div></div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-danger"><div class="card-body"><h5>Hủy</h5><h3>3</h3></div></div>
                    </div>
                </div>

                <div class="input-group mb-4">
                    <input type="text" class="form-control" placeholder="Tìm kiếm đơn hàng...">
                    <button class="btn btn-outline-secondary" type="button">Lọc</button>
                </div>

                <div class="table-responsive mb-4">
                    <table class="table table-striped table-hover border">
                        <thead class="table-dark">
                            <tr><th>#</th><th>Khách hàng</th><th>Trạng thái</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>1</td><td>Nguyễn Văn A</td><td><span class="badge bg-success">Hoàn thành</span></td></tr>
                            <tr><td>2</td><td>Trần Thị B</td><td><span class="badge bg-warning text-dark">Chờ xử lý</span></td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="accordion" id="faqAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                                Hướng dẫn quản lý đơn hàng
                            </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#faqAccordion">
                            <div class="accordion-body">Click vào bảng để xem chi tiết từng đơn...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
