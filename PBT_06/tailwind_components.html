<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Components</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto space-y-12">
        <h1 class="text-4xl font-bold text-gray-800 border-b pb-4">UI Component Library</h1>

        <section>
            <h2 class="text-2xl font-semibold mb-4">1. Buttons</h2>
            <div class="flex flex-wrap gap-4 items-center">
                <button class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:ring-4 focus:ring-blue-300 transition-all">Primary</button>
                <button class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 focus:ring-4 focus:ring-gray-300 transition-all">Secondary</button>
                <button class="px-4 py-2 border-2 border-blue-500 text-blue-500 rounded-md hover:bg-blue-50 focus:ring-4 focus:ring-blue-200 transition-all">Outline</button>
                <button class="px-4 py-2 bg-blue-300 text-white rounded-md cursor-not-allowed opacity-50" disabled>Disabled</button>
                
                <button class="px-4 py-2 bg-indigo-500 text-white rounded-md flex items-center cursor-wait">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Loading
                </button>

                <button class="px-3 py-1 text-sm bg-purple-500 text-white rounded-md hover:bg-purple-600">Small</button>
                <button class="px-6 py-3 text-lg bg-purple-500 text-white rounded-md hover:bg-purple-600">Large</button>
            </div>
        </section>

        <section>
            <h2 class="text-2xl font-semibold mb-4">2. Forms</h2>
            <div class="bg-white p-6 rounded-lg shadow-md max-w-md space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="nhap@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Quốc gia</label>
                    <select class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>Việt Nam</option>
                        <option>Hoa Kỳ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
                    <textarea class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">
                    <label class="ml-2 block text-sm text-gray-900 cursor-pointer">Đồng ý điều khoản</label>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-2xl font-semibold mb-4">3. Alerts</h2>
            <div class="space-y-4 max-w-2xl">
                <div class="flex justify-between items-center bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded" role="alert">
                    <p><strong>Thành công!</strong> Dữ liệu đã được lưu.</p>
                    <button class="text-green-700 hover:text-green-900 font-bold">&times;</button>
                </div>
                <div class="flex justify-between items-center bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded" role="alert">
                    <p><strong>Lỗi!</strong> Đã xảy ra sự cố, vui lòng thử lại.</p>
                    <button class="text-red-700 hover:text-red-900 font-bold">&times;</button>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-2xl font-semibold mb-4">4. Navigation</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white p-4 shadow rounded-lg flex space-x-4">
                    <a href="#" class="px-3 py-2 bg-blue-50 text-blue-700 rounded-md font-medium">Dashboard</a>
                    <a href="#" class="px-3 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-md font-medium transition-colors">Team</a>
                    <a href="#" class="px-3 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-md font-medium transition-colors">Projects</a>
                </div>
                <div class="bg-white p-4 shadow rounded-lg w-64 flex flex-col space-y-2">
                    <a href="#" class="block px-4 py-2 bg-blue-50 text-blue-700 rounded-md font-medium">Dashboard</a>
                    <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-md font-medium transition-colors">Team</a>
                    <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-md font-medium transition-colors">Settings</a>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
