<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item { height: 400px; background-color: #343a40; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">MyStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Sản phẩm</a></li>
                </ul>
                <form class="d-flex me-2">
                    <input class="form-control me-2" type="search" placeholder="Tìm kiếm...">
                    <button class="btn btn-outline-success" type="submit">Tìm</button>
                </form>
                <button class="btn btn-primary">Giỏ hàng</button>
            </div>
        </div>
    </nav>

    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner text-center text-white">
            <div class="carousel-item active d-flex align-items-center justify-content-center">
                <div>
                    <h2>Mùa Hè Sôi Động</h2>
                    <p>Giảm giá đến 50% tất cả mặt hàng</p>
                </div>
            </div>
            </div>
    </div>

    <div class="container my-5">
        <h2 class="text-center mb-4">Sản Phẩm Nổi Bật</h2>
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 position-relative">
                    <span class="badge bg-danger position-absolute top-0 start-0 m-2">Sale</span>
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Sản phẩm 1</h5>
                        <p class="card-text text-muted">Mô tả ngắn gọn về sản phẩm này.</p>
                        <button class="btn btn-outline-primary mt-auto" data-bs-toggle="modal" data-bs-target="#quickViewModal">Xem nhanh</button>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-3"><h5>Về chúng tôi</h5></div>
                <div class="col-12 col-md-3"><h5>Chính sách</h5></div>
                <div class="col-12 col-md-3"><h5>Hỗ trợ</h5></div>
                <div class="col-12 col-md-3"><h5>Liên hệ</h5></div>
            </div>
        </div>
    </footer>

    <div class="modal fade" id="quickViewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Chi tiết sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Thông tin chi tiết tuyệt vời của sản phẩm này nằm ở đây.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary">Thêm vào giỏ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
